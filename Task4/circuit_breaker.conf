# Task 4, part 2 -- circuit breaker for calls to the external logistics service.
# Requirement: 3s response timeout; after 5 consecutive errors, attempts are disabled for 30s
# (return a fallback); once the service recovers, calls resume.
#
# On open-source NGINX the "open" state is implemented by a passive upstream health check:
# max_fails=5 fail_timeout=30s marks the server unavailable for 30s after 5 errors, then lets a
# probe request through (half-open). The hard timeout is proxy_*_timeout 3s. The controlled
# response on open is served via error_page -> a named @fallback location.
# (Active health_check is an NGINX Plus feature and is not used here.)
#
# The upstream lists two provider endpoints on purpose: open-source NGINX ignores max_fails for a
# single-server upstream, so the breaker can only "open" with >= 2 servers (see nginx-test.conf,
# which drives the same shape under locust). With a single server max_fails is silently ignored.

http {
    upstream logistics_backend {
        # 5 errors within 30s -> a server is marked "off" for 30s (circuit breaker open)
        server logistics-1.company.com max_fails=5 fail_timeout=30s;
        server logistics-2.company.com max_fails=5 fail_timeout=30s;
    }

    server {
        listen 8080;

        location /logistics/ {
            proxy_pass http://logistics_backend;

            # 3s timeout on each phase of the call to the external service
            proxy_connect_timeout 3s;
            proxy_send_timeout    3s;
            proxy_read_timeout    3s;

            # What counts as an upstream error (toward max_fails) and triggers the fallback
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 1;   # one attempt per request -> one ~3s timeout, not 2x3s

            # On error/unavailability -> controlled fallback instead of hanging
            error_page 502 503 504 = @fallback;
        }

        location @fallback {
            default_type application/json;
            return 200 '{"status":"degraded","service":"logistics","message":"temporary fallback, try later"}';
        }
    }
}
