# Circuit breaker for the external logistics service: 3s timeout, 5 errors -> open for 30s, then a
# controlled fallback. "Open" is the passive upstream health check (max_fails/fail_timeout). Two
# endpoints are needed because open-source NGINX ignores max_fails for a single-server upstream.

http {
    upstream logistics_backend {
        server logistics-1.company.com max_fails=5 fail_timeout=30s;
        server logistics-2.company.com max_fails=5 fail_timeout=30s;
    }

    server {
        listen 8080;

        location /logistics/ {
            proxy_pass http://logistics_backend;

            proxy_connect_timeout 3s;
            proxy_send_timeout    3s;
            proxy_read_timeout    3s;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 1;   # keep one request inside the 3s budget
            error_page 502 503 504 = @fallback;
        }

        location @fallback {
            default_type application/json;
            return 200 '{"status":"degraded","service":"logistics","message":"temporary fallback, try later"}';
        }
    }
}
