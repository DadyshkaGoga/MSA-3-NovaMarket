# Per-channel rate limit: web 50 r/s, mobile 30 r/s per IP.
# X-Client-Type selects the zone; the map yields an empty key for the other channel, which disables
# its limit (NGINX skips empty keys) -- open-source NGINX can't pick a zone conditionally otherwise.

http {
    map $http_x_client_type $web_key {
        "web"   $binary_remote_addr;
        default "";
    }
    map $http_x_client_type $mobile_key {
        "mobile" $binary_remote_addr;
        default  "";
    }

    limit_req_zone $web_key    zone=web:10m    rate=50r/s;
    limit_req_zone $mobile_key zone=mobile:10m rate=30r/s;
    limit_req_status 429;

    server {
        listen 80;

        location /api/ {
            limit_req zone=web    burst=50  nodelay;
            limit_req zone=mobile burst=30  nodelay;
            proxy_pass http://backend;
        }
    }
}
