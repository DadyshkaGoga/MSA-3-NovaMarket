# Task 4, part 1 -- rate limiter with different limits per client channel.
# Requirement: web -> up to 50 r/s per IP, mobile -> up to 30 r/s per IP.
#
# The channel is taken from the X-Client-Type header (web|mobile) set by the client app.
# Open-source NGINX cannot pick a limit zone conditionally, so we use the idiom: a map builds the
# zone key, and an EMPTY key disables the limit for the non-matching channel (NGINX skips empty keys).

http {
    # web zone key: non-empty only for the web channel -> 50 r/s limit per IP
    map $http_x_client_type $web_key {
        "web"   $binary_remote_addr;
        default "";
    }
    # mobile zone key: non-empty only for the mobile channel -> 30 r/s limit per IP
    map $http_x_client_type $mobile_key {
        "mobile" $binary_remote_addr;
        default  "";
    }

    limit_req_zone $web_key    zone=web:10m    rate=50r/s;
    limit_req_zone $mobile_key zone=mobile:10m rate=30r/s;

    # Over the limit -> 429 Too Many Requests (clearer than the default 503)
    limit_req_status 429;

    server {
        listen 80;

        location /api/ {
            # Both directives are active; for the other channel the key is empty, so its zone is skipped.
            # burst smooths short spikes, nodelay does not delay allowed requests.
            limit_req zone=web    burst=50  nodelay;
            limit_req zone=mobile burst=30  nodelay;

            proxy_pass http://backend;
        }
    }
}
