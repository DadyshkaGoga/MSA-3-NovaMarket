# Task 4, part 3 -- full WORKING config to test the rate limiter and circuit breaker.
# Combines the production blocks (rate_limiter.conf + circuit_breaker.conf) with test upstreams and
# a mock server, so both scenarios can be driven by locust against localhost.
#
# Run (NGINX in docker):
#   docker run --rm -p 8080:8080 -v "$PWD/nginx-test.conf:/etc/nginx/nginx.conf:ro" nginx:alpine
#   locust -f rate_limiter.py    --host=http://localhost:8080 --headless -u 80 -r 80 -t 30s
#   locust -f circuit_breaker.py --host=http://localhost:8080 --headless -u 20 -r 20 -t 60s

events {}

http {
    # --- Rate limiting per channel (part 1) ---
    map $http_x_client_type $web_key {
        "web"   $binary_remote_addr;
        default "";
    }
    map $http_x_client_type $mobile_key {
        "mobile" $binary_remote_addr;
        default  "";
    }
    limit_req_zone $web_key    zone=web:10m    rate=50r/s;
    limit_req_zone $mobile_key zone=mobile:10m rate=30r/s;
    limit_req_status 429;

    # --- Test upstreams ---
    # backend for /api/ -- local mock (fast 200)
    upstream backend {
        server 127.0.0.1:8081;
    }
    # logistics for /logistics/ -- unreachable addresses (blackhole): calls hit the 3s timeout,
    # which is what trips the circuit breaker. max_fails=5 fail_timeout=30s: once a server collects
    # 5 errors it is "off" for 30s (circuit breaker open) -> instant fallback.
    # NOTE: open-source NGINX ignores max_fails for a single-server upstream, so two servers are used
    # here to make the "open" state observable.
    upstream logistics_backend {
        server 10.255.255.1:9090 max_fails=5 fail_timeout=30s;
        server 10.255.255.2:9090 max_fails=5 fail_timeout=30s;
    }

    # --- Main server: entry point for tests ---
    server {
        listen 8080;

        # Part 1: rate limiter
        location /api/ {
            limit_req zone=web    burst=50  nodelay;
            limit_req zone=mobile burst=30  nodelay;
            proxy_pass http://backend;
        }

        # Part 2: circuit breaker
        location /logistics/ {
            proxy_pass http://logistics_backend;
            proxy_connect_timeout 3s;
            proxy_send_timeout    3s;
            proxy_read_timeout    3s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 1;   # one attempt per request -> one ~3s timeout, one error
            error_page 502 503 504 = @fallback;
        }
        location @fallback {
            default_type application/json;
            return 200 '{"status":"degraded","service":"logistics","message":"temporary fallback, try later"}';
        }
    }

    # --- App backend mock for /api/ (mimics web/mobile responses) ---
    server {
        listen 8081;
        location /api/ {
            default_type application/json;
            if ($http_x_client_type = "web") {
                return 200 '{"status":"success","service":"web_backend"}';
            }
            if ($http_x_client_type = "mobile") {
                return 200 '{"status":"success","service":"mobile_backend"}';
            }
            return 200 '{"status":"success","service":"default_backend"}';
        }
    }
}
