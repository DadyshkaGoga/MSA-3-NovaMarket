# Runnable config that wires the rate limiter + circuit breaker to test upstreams, so both can be
# driven by locust against localhost (locust commands are in the README).

events {}

http {
    # --- Rate limiting per channel ---
    map $http_x_client_type $web_key {
        "web"   $binary_remote_addr;
        default "";
    }
    map $http_x_client_type $mobile_key {
        "mobile" $binary_remote_addr;
        default  "";
    }
    limit_req_zone $web_key    zone=web:10m    rate=50r/s;
    limit_req_zone $mobile_key zone=mobile:10m rate=30r/s;
    limit_req_status 429;

    # --- Test upstreams ---
    upstream backend {
        server 127.0.0.1:8081;
    }
    # Blackhole addresses so requests hit the 3s timeout and trip the breaker; two servers because
    # max_fails is ignored for a single-server upstream.
    upstream logistics_backend {
        server 10.255.255.1:9090 max_fails=5 fail_timeout=30s;
        server 10.255.255.2:9090 max_fails=5 fail_timeout=30s;
    }

    server {
        listen 8080;

        location /api/ {
            limit_req zone=web    burst=50  nodelay;
            limit_req zone=mobile burst=30  nodelay;
            proxy_pass http://backend;
        }

        location /logistics/ {
            proxy_pass http://logistics_backend;
            proxy_connect_timeout 3s;
            proxy_send_timeout    3s;
            proxy_read_timeout    3s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 1;
            error_page 502 503 504 = @fallback;
        }
        location @fallback {
            default_type application/json;
            return 200 '{"status":"degraded","service":"logistics","message":"temporary fallback, try later"}';
        }
    }

    # Backend mock for /api/
    server {
        listen 8081;
        location /api/ {
            default_type application/json;
            if ($http_x_client_type = "web") {
                return 200 '{"status":"success","service":"web_backend"}';
            }
            if ($http_x_client_type = "mobile") {
                return 200 '{"status":"success","service":"mobile_backend"}';
            }
            return 200 '{"status":"success","service":"default_backend"}';
        }
    }
}
