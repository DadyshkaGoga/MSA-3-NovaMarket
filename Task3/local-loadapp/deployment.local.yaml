# Manifest for the live run on Apple Silicon only: same Deployment as the production
# deployment.yaml, but with the local arm64 stand-in image (imagePullPolicy: Never, loaded via
# minikube image load). The Service and both HPAs (hpa-memory.yaml, hpa-rps.yaml) are reused as-is.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaletestapp
  labels:
    app: scaletestapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaletestapp
  template:
    metadata:
      labels:
        app: scaletestapp
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: scaletestapp
          image: scaletestapp-local:arm64
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 20Mi
            limits:
              memory: 30Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
