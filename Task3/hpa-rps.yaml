# Part 2. HPA on requests-per-second per pod.
# The http_requests_per_second metric is published by prometheus-adapter into custom.metrics.k8s.io
# (rate(http_requests_total[1m]) per pod -- see prometheus/prometheus-adapter-values.yaml).
# Target is 10 rps per pod; above that the HPA adds replicas (1..10).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scaletestapp-rps
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scaletestapp
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "10"
